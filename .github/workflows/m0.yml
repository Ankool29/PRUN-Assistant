name: PRUN Assistant

on:
  push:
    branches: [main, 'feature/prun-m0', 'feature/prun-m1']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read

concurrency:
  group: prun-${{ github.ref == 'refs/heads/feature/prun-m1' && 'm1-validation' || (github.event_name == 'pull_request' && github.ref || 'm0-publication') }}
  cancel-in-progress: false

jobs:
  check-android-preview:
    name: Tests Android sur la prévisualisation HTTPS
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/prun-m1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
        env:
          PRUN_TEST_URL: https://ankool29.github.io/PRUN-Assistant/preview/m1/

  checks:
    name: Tests et compilation
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/feature/prun-m1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - run: npm run build -- --base=/PRUN-Assistant/preview/m1/
      - run: npm run test:mobile
        env:
          PRUN_TEST_PREFIX: /PRUN-Assistant/preview/m1/
      - run: npm run build
      - name: Actualiser les données de la prévisualisation
        if: github.ref == 'refs/heads/feature/prun-m1'
        run: |
          if python -m collector.collect; then
            python -m collector.history
            python -m collector.navigation || echo "::warning::Carte FIO de la branche conservée."
            npm run build
          else
            echo "::warning::FIO indisponible. L’artefact conserve les instantanés de la branche et leurs dates."
          fi
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/feature/prun-m1' || github.head_ref == 'feature/prun-m1'
        with:
          name: prun-m1-preview
          path: dist
          retention-days: 14

  build-pages:
    name: Collecte FIO et préparation de Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, m1-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m collector.collect
      - run: python -m collector.history
      - run: python -m collector.navigation || echo "::warning::Carte FIO de la branche conservée."
      - run: npm run build
      - uses: actions/configure-pages@v5
      - name: Réserver le sous-chemin sans écraser les fichiers M0
        run: test ! -e dist/preview
      - uses: actions/download-artifact@v4
        with:
          name: m1-pages-subdirectory
          path: dist/preview/m1
      - name: Vérifier le contenu de la prévisualisation
        run: |
          test -s dist/preview/m1/index.html
          test -s dist/preview/m1/data/fio.json
          test -s dist/preview/m1/data/history.json
          test -s dist/preview/m1/data/navigation.json
          grep -q '/PRUN-Assistant/preview/m1/assets/' dist/preview/m1/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publication GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  m1-preview:
    name: Prévisualisation M1 isolée
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Révision testée de la PR #2. Ce job ne possède aucun droit de déploiement.
          ref: dff3ba89136ceb1c64e671909d4a7842a79ad67e
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m collector.collect
      - run: python -m collector.history
      - run: python -m collector.navigation || echo "::warning::Carte FIO de la branche conservée."
      - run: npm run build -- --base=/PRUN-Assistant/preview/m1/
      - uses: actions/upload-artifact@v4
        with:
          name: m1-pages-subdirectory
          path: dist
          if-no-files-found: error
          retention-days: 1
